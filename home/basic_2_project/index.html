<body>
     <nav>

    <div class="container">
        <h1>BMI Calculator</h1>
        <form>
            <p class="input_head"><label>Height in cm: </label><input type="text" id="height"/></p>
            <p class="input_head"><label>Weight in kg: </label><input type="text" id="weight"/></p>
            <button>calculate</button>            
            <div id="results"></div>
            <span id="massage"></span>
            <div id="weight-guide">
                <h2>BMI Weight Guide</h2>
                <p class="para under">Under Weight = less than 18.6</p>
                <p class="para normal">Normal range = 18.6 to 24.9</p>
                <p class="para over">Overweight = Greater than 24.9</p>               
            </div>
        </form>
    </div>
</body>
<script src="script.js"></script>
